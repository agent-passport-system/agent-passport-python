name: Tests

# Runs the whole pytest suite on every pull request and every push to main.
# Before this, the only checks on a pull request were the drift scan and the
# cross-impl JCS job, and that job is path filtered to the canonical modules,
# so a change anywhere else reached main without a single test being run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-actor-smoke:
    # Manual only. Runs the release actor guard with read permissions so its
    # live lookup can be observed before the first publication.
    name: Release actor lookup smoke check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check this run attempt with its workflow token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_actor_state.py

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 3.10 is the floor pyproject declares in requires-python. Testing the
    # floor is what catches syntax newer than the package claims to support.
    # The other versions are the ones the classifiers list, so each listed
    # version has a test run behind it.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        run: python3 -m pytest -q
