name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gates that run before anything is built or published. The publish job
  # needs this one, so a tag that fails any gate publishes nothing.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # read this run's attempt to establish who requested it
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # First, before any other gate. Repository ownership is not the release
      # credential: the guard checks the immutable actor id of whoever pushed the
      # tag and, through the run attempt API, of whoever asked for this attempt,
      # so a rerun cannot reuse an earlier attempt's authorization. It fails
      # closed on anything it cannot establish.
      - name: Require the authorized release actor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_actor_state.py

      # The ruleset is what stops a v* tag from being created, moved or deleted
      # outside the release path. In an organization its bypass can only be a
      # role, so this expects exactly the organization admin role in always mode.
      - name: Verify version-tag restrictions are active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/tag_ruleset_state.py

      - name: Require the tag to equal the package version
        run: |
          set -euo pipefail
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg_version"
            exit 1
          fi

      - name: Require the tagged commit to be in main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not in origin/main"
            exit 1
          fi

      - name: Install package and test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run the full test suite
        run: python -m pytest -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      actions: read # read this run's attempt to establish who requested it
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Re-checked here, not inherited from verify. Rerunning only this job skips
      # the verify gate entirely, and this is the job that holds id-token: write
      # and reaches PyPI, so the principal is established again before the build.
      - name: Require the authorized release actor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_actor_state.py
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (Trusted Publishing, PEP 740 attestations)
        # v1.14.2 or newer is required, not cosmetic: hatchling now emits
        # Metadata-Version 2.5, and the twine bundled in v1.14.0 refuses it with
        # "InvalidDistribution: '2.5' is not a valid metadata version". v1.14.2
        # ships twine 7, which accepts it. The 2.11.0 tag failed on exactly this.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
